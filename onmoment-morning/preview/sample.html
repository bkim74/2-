<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>온순간 아침 창</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #eef0ec;
    --surface: #fbfbf8;
    --surface-2: #f4f5f1;
    --ink: #1c2330;
    --ink-2: #3b4454;
    --muted: #697385;
    --line: #d9ddd6;
    --amber: #c8741f;
    --amber-soft: rgba(214, 131, 46, 0.14);
    --life: #2f7565;
    --build: #3456a0;
    --content: #b04c3a;
    --claude: #b8662a;
    --rest: #66738a;
    --done: #2f7565;
    --now: #c8741f;
    --shadow: 0 1px 2px rgba(28, 35, 48, 0.06), 0 8px 28px rgba(28, 35, 48, 0.06);
    --serif: "Hahmlet", "Nanum Myeongjo", "AppleMyungjo", "Batang", serif;
    --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0f131a;
      --surface: #171c25;
      --surface-2: #1d2330;
      --ink: #e8eaee;
      --ink-2: #c5cad4;
      --muted: #8f98a8;
      --line: #2b3240;
      --amber: #f0a24f;
      --amber-soft: rgba(240, 162, 79, 0.14);
      --life: #6cc0a8;
      --build: #8aa6ea;
      --content: #e98a74;
      --claude: #f0a24f;
      --rest: #9aa6bb;
      --done: #6cc0a8;
      --now: #f0a24f;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0f131a;
    --surface: #171c25;
    --surface-2: #1d2330;
    --ink: #e8eaee;
    --ink-2: #c5cad4;
    --muted: #8f98a8;
    --line: #2b3240;
    --amber: #f0a24f;
    --amber-soft: rgba(240, 162, 79, 0.14);
    --life: #6cc0a8;
    --build: #8aa6ea;
    --content: #e98a74;
    --claude: #f0a24f;
    --rest: #9aa6bb;
    --done: #6cc0a8;
    --now: #f0a24f;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 10px 30px rgba(0, 0, 0, 0.25);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.75;
    word-break: keep-all;
    overflow-wrap: anywhere;
    padding-inline: 16px;
    padding-block: 20px 64px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  .label { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .section-head h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; }
  .chip { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; font-weight: 500; white-space: nowrap; }
  .tag-life { color: var(--life); } .tag-build { color: var(--build); } .tag-content { color: var(--content); } .tag-claude { color: var(--claude); } .tag-rest { color: var(--rest); }

  /* ---------- status banner ---------- */
  .banner { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; }
  .banner[data-kind="pending"] { border-color: var(--amber); background: var(--amber-soft); }
  .banner[data-kind="error"] { border-color: var(--content); }
  .banner b { font-weight: 600; }
  .banner small { color: var(--muted); font-size: 12.5px; }
  .pulse { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); margin-right: 8px;
    animation: pulse 1.4s ease-in-out infinite; vertical-align: 1px; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* ---------- 1. sky hero ---------- */
  .sky { border-radius: 20px; border: 1px solid var(--line); padding: 24px 26px 8px; display: grid; gap: 12px;
    background: var(--sky, linear-gradient(180deg, rgba(122, 132, 196, 0.22), rgba(236, 160, 96, 0.26))), var(--surface); }
  .sky-top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  .date { font-family: var(--mono); font-size: 13px; color: var(--ink-2); }
  .theme-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 12.5px; color: var(--ink-2); }
  .one-line { font-family: var(--serif); font-weight: 500; font-size: clamp(28px, 4.6vw, 46px); line-height: 1.3; letter-spacing: -0.01em; max-width: 22ch; }
  .one-line::before { content: "“"; color: var(--amber); margin-right: 2px; }
  .one-line::after { content: "”"; color: var(--amber); margin-left: 2px; }
  .greeting { font-size: 15.5px; color: var(--ink-2); max-width: 64ch; margin: 0; }
  .horizon { width: 100%; height: auto; display: block; }
  .horizon text { font-family: var(--mono); font-size: 13px; fill: var(--muted); }
  .sky-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); padding-bottom: 10px; }
  .sky-meta b { color: var(--ink); font-weight: 600; }

  /* ---------- 2. today ---------- */
  .row-2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .line3 { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px dashed var(--line); }
  .line3:first-of-type { border-top: 0; padding-top: 0; }
  .line3 .k { font-family: var(--serif); font-weight: 700; font-size: 15px; padding-top: 1px; }
  .line3[data-k="reality"] .k { color: var(--rest); } .line3[data-k="wish"] .k { color: var(--life); } .line3[data-k="choice"] .k { color: var(--amber); }
  .line3 .v { font-size: 16.5px; line-height: 1.65; border-radius: 6px; padding: 2px 6px; margin: -2px -6px; }
  .line3 .v:hover, .line3 .v:focus { background: var(--surface-2); outline: 1px solid var(--line); }
  .ret { margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 14.5px; color: var(--ink-2); }
  .ret b { color: var(--ink); font-weight: 600; }
  .todo { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .todo label { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; cursor: pointer;
    padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
  .todo input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--amber); }
  .todo .t { font-weight: 600; font-size: 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .todo .w { font-size: 13.5px; color: var(--muted); display: block; margin-top: 2px; }
  .todo li.checked label { background: var(--surface-2); }
  .todo li.checked .t span:first-child { text-decoration: line-through; color: var(--muted); }

  /* ---------- 3. flow + gates ---------- */
  .plan { list-style: none; margin: 0; padding: 0; display: grid; }
  .plan li { display: grid; grid-template-columns: 96px 18px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
  .plan li:first-child { border-top: 0; }
  .plan .tm { font-family: var(--mono); font-size: 13px; color: var(--muted); padding-top: 3px; font-variant-numeric: tabular-nums; }
  .plan input { width: 17px; height: 17px; margin-top: 4px; accent-color: var(--amber); }
  .plan .ttl { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .plan .det { color: var(--ink-2); font-size: 14.5px; }
  .plan li.is-now { background: var(--amber-soft); border-radius: 10px; padding-inline: 10px; margin-inline: -10px; border-top-color: transparent; }
  .plan li.is-now + li { border-top-color: transparent; }
  .plan li.checked .ttl span:first-child, .plan li.checked .det { text-decoration: line-through; color: var(--muted); }
  .gates { list-style: none; margin: 0; padding: 0; display: grid; }
  .gates li { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 8px 0; position: relative; }
  .gates li::before { content: ""; position: absolute; left: 6px; top: 24px; bottom: -8px; width: 2px; background: var(--line); }
  .gates li:last-child::before { display: none; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin-top: 5px; position: relative; z-index: 1; }
  .gates li[data-s="done"] .dot { background: var(--done); border-color: var(--done); }
  .gates li[data-s="now"] .dot { border-color: var(--now); box-shadow: 0 0 0 4px var(--amber-soft); }
  .gates li[data-s="done"] .g-title { color: var(--muted); }
  .gates li[data-s="now"] .g-title { font-weight: 600; }
  .g-title { font-size: 14.5px; line-height: 1.5; }
  .dday { font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; padding-top: 2px; white-space: nowrap; color: var(--muted); }
  .dday.soon { color: var(--amber); font-weight: 500; }

  /* ---------- 4. radar ---------- */
  .radar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .col { display: grid; gap: 10px; align-content: start; }
  .col h3 { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
  .col h3 .n { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 400; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); display: grid; gap: 6px; }
  .item .top { display: flex; justify-content: space-between; gap: 10px; align-items: start; }
  .item b { font-size: 15px; font-weight: 600; line-height: 1.45; }
  .item .org { font-size: 12.5px; color: var(--muted); }
  .item p { margin: 0; font-size: 14px; color: var(--ink-2); line-height: 1.6; }
  .item .act { font-size: 13.5px; color: var(--ink); }
  .item .act::before { content: "→ "; color: var(--amber); }
  .item a { justify-self: start; font-size: 13px; color: var(--build); text-decoration: none; border-bottom: 1px solid currentColor; }
  .item a:hover { color: var(--amber); }
  .when { font-family: var(--mono); font-size: 11.5px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .when.hot { background: var(--amber-soft); color: var(--amber); border-color: var(--amber); }
  .radar-empty { font-size: 13.5px; color: var(--muted); padding: 12px 0; }

  /* ---------- 5. advice tabs ---------- */
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
  .tab { border: 0; background: transparent; padding: 10px 14px; border-bottom: 3px solid transparent; color: var(--muted); font-size: 15px; white-space: nowrap; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); font-weight: 600; }
  .chapter h3.ch-title { font-family: var(--serif); font-weight: 500; font-size: clamp(21px, 2.6vw, 27px); line-height: 1.4; margin-bottom: 14px; }
  .evidence { margin: 0 0 20px; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; font-size: 13.5px; color: var(--ink-2); }
  .prose { max-width: 68ch; font-size: 16.5px; line-height: 1.85; }
  .prose p { margin: 0 0 1em; }
  .prose h3 { font-family: var(--serif); font-weight: 700; font-size: 18px; margin: 1.5em 0 0.5em; }
  .prose ul, .prose ol { margin: 0 0 1em; padding-left: 1.3em; }
  .prose li { margin: 0.3em 0; }
  .prose blockquote { margin: 1.2em 0; padding: 2px 0 2px 16px; border-left: 2px solid var(--amber); font-family: var(--serif); font-size: 17.5px; }
  .prose strong { font-weight: 600; background: linear-gradient(transparent 62%, var(--amber-soft) 62%); }
  .prose code { font-family: var(--mono); font-size: 0.88em; background: var(--surface-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; }
  .actions { list-style: none; margin: 22px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .actions label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; cursor: pointer; font-size: 15px; }
  .actions input { width: 17px; height: 17px; margin-top: 5px; accent-color: var(--amber); }
  .actions li.checked span { color: var(--muted); text-decoration: line-through; }
  .extra { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 14px; }
  .extra h4 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink-2); }
  .tips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .tip { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 8px; align-content: start; }
  .tip b { font-size: 15.5px; }
  .tip p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .prompt-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; overflow-x: auto; margin: 0; }
  .copy { justify-self: start; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 12px; font-size: 13px; color: var(--ink-2); }
  .shots { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .shot { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 4px; align-content: start; cursor: pointer; min-height: 104px; }
  .shot b { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; }
  .shot span { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
  .shot input { position: absolute; opacity: 0; pointer-events: none; }
  .shot.on { border-color: var(--content); background: var(--surface-2); }
  .shot.on b::after { content: " ✓"; color: var(--content); }
  .plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; color: var(--ink-2); font-size: 15px; }
  .q { font-family: var(--serif); font-size: 20px; line-height: 1.5; margin: 0; }

  /* ---------- 6. evening ---------- */
  .evening { display: grid; gap: 14px; }
  .evening label { display: grid; gap: 6px; font-family: var(--serif); font-size: 16.5px; }
  .evening textarea { font-family: var(--sans); font-size: 15px; min-height: 70px; resize: vertical; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .btn { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 10px; padding: 8px 16px; font-weight: 500; font-size: 14px; }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .status { font-size: 13px; color: var(--muted); }
  footer { text-align: center; font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; }

  @media (max-width: 920px) {
    .row-2, .radar { grid-template-columns: minmax(0, 1fr); }
    .tips { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    body { font-size: 15.5px; }
    .sky { padding: 20px 18px 6px; }
    .shots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .plan li { grid-template-columns: 74px 18px minmax(0, 1fr); gap: 8px; }
    .line3 { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner" role="status" hidden></div>

  <section class="sky" id="sky" aria-label="오늘">
    <div class="sky-top"><span class="date" id="date"></span><button class="theme-btn" id="themeBtn" type="button">테마</button></div>
    <h1 class="one-line" id="oneLine"></h1>
    <p class="greeting" id="greeting"></p>
    <svg class="horizon" id="horizon" viewBox="0 0 1000 150" role="img" aria-label="오늘 하루의 흐름과 지금 시각"></svg>
    <div class="sky-meta" id="skyMeta"></div>
  </section>

  <section class="row-2" aria-label="오늘">
    <article class="panel">
      <div class="section-head"><h2>오늘의 3줄</h2><span class="label">고쳐 쓰면 저장됩니다</span></div>
      <div class="line3" data-k="reality"><span class="k">현재</span><div class="v" id="l-reality" contenteditable="true" spellcheck="false"></div></div>
      <div class="line3" data-k="wish"><span class="k">바람</span><div class="v" id="l-wish" contenteditable="true" spellcheck="false"></div></div>
      <div class="line3" data-k="choice"><span class="k">선택</span><div class="v" id="l-choice" contenteditable="true" spellcheck="false"></div></div>
      <p class="ret" id="ret"></p>
    </article>
    <article class="panel">
      <div class="section-head"><h2>오늘 꼭 할 3가지</h2><span class="label num" id="todoCount"></span></div>
      <ul class="todo" id="todo"></ul>
    </article>
  </section>

  <section class="row-2">
    <div class="panel">
      <div class="section-head"><h2>오늘의 흐름</h2><span class="label num" id="planCount"></span></div>
      <ol class="plan" id="plan"></ol>
    </div>
    <div class="panel">
      <div class="section-head"><h2>게이트</h2><span class="label">모두의창업 · Creator OS</span></div>
      <ul class="gates" id="gates"></ul>
    </div>
  </section>

  <section class="panel" aria-labelledby="radarTitle">
    <div class="section-head"><h2 id="radarTitle">레이더 · 오늘 찾아온 기회</h2><span class="label" id="radarMeta"></span></div>
    <div class="radar" id="radar"></div>
  </section>

  <section class="panel" aria-label="오늘의 조언">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="chapter"></div>
  </section>

  <section class="panel" aria-labelledby="eveningTitle">
    <div class="section-head"><h2 id="eveningTitle">오늘 밤 3분 Return</h2><span class="label">내일 아침의 A가 됩니다</span></div>
    <form class="evening" id="evening"></form>
  </section>

  <footer id="foot"></footer>
</div>

<script>
const BRIEF = {"greeting": "범님, 좋은 아침입니다. 지난 18일 하루를 꼬박 들여 온순간의 North Star를 다시 세우셨고, 그 끝에 스스로 이렇게 정리하셨죠. '대화를 통째로 넣고 구현하라고 하지 않는다.' 오늘은 그 문장이 제품이 아니라 범님의 하루에 먼저 적용되는 날이면 좋겠습니다.", "one_line": "장면이 먼저, 의미는 나중.", "return_question": "18일에 세운 North Star 문장들 가운데, 이번 주에 실제로 한 번이라도 살아본 문장이 있었나요? 떠오르지 않는다면 그것도 있는 그대로의 Evidence입니다.", "three_lines": {"reality": "철학·설계·신청서는 충분히 깊어졌다. 지금 부족한 것은 더 많은 문장이 아니라, 실제로 살아낸 장면이다.", "wish": "상대를 고치기 전에 제대로 만나는 나 — 아들 앞에서도, 아내 앞에서도, 1R의 50명 앞에서도.", "choice": "오늘 누군가 말을 시작하면, 첫 60초는 답하지 않고 듣는다."}, "day_plan": [{"time": "06:00", "end": "07:00", "title": "기도 · 아침 · 스트레칭", "tag": "life", "detail": "이 창을 열고 3줄만 범님의 말로 고칩니다."}, {"time": "07:00", "end": "09:00", "title": "자전거 · 러닝 + 말씀", "tag": "life", "detail": "휴대폰은 주머니에. Moment가 걸릴 때만 카메라."}, {"time": "09:00", "end": "13:00", "title": "Activity — 안 가본 곳, 안 해본 것", "tag": "content", "detail": "북한산둘레길 한 구간 — 걷다가 만난 한 사람에게 '왜 걷는지' 묻기"}, {"time": "13:00", "end": "14:00", "title": "점심과 쉼", "tag": "rest", "detail": "쉬다가 '뭔가 해야 할 것 같은 느낌'이 올라오면 한 줄만 적기"}, {"time": "14:00", "end": "18:00", "title": "온순간 빌드 (오늘만)", "tag": "build", "detail": "오늘만 한 블록 바꿈: 'Insight'를 무엇으로 셀지 1페이지 (1R 게이트가 가장 급해서)"}, {"time": "18:00", "end": "19:00", "title": "저녁", "tag": "rest", "detail": "가족과 식탁. 조언 대신 질문 하나."}, {"time": "19:00", "end": "20:00", "title": "글쓰기", "tag": "content", "detail": "오전에 만난 사람의 한마디를 한 문단으로"}, {"time": "20:00", "end": "21:00", "title": "운동", "tag": "life", "detail": "짐 · 러닝 · 수영 중 하나."}, {"time": "21:00", "end": "22:00", "title": "온순간 블로그", "tag": "content", "detail": "오늘의 3줄과 Return을 블로그 한 편으로."}, {"time": "22:00", "end": "22:15", "title": "밤 3분 Return, 그리고 Dream", "tag": "life", "detail": "아래 Return을 저장하고 컴퓨터를 끕니다."}], "build_focus": {"gate": "1단계 · 1R 50명 코호트 (자기 언어 Insight 20%)", "today_task": "'자기 언어 Insight'를 무엇으로 셀지 정의한 1페이지 — 실제 베타 카드로 포함/제외 예시 각 3개", "metric": "베타 카드 20장을 이 정의로 직접 분류했고, 애매한 카드가 몇 장인지 숫자로 적었다"}, "content_mission": {"question": "나는 오늘 누구의 말을 끝까지 들었나?", "shots": [{"key": "WHE ions": ["3줄 카드의 '선택'을 범님의 말로 고쳐 쓰기", "오늘 한 사람 앞에서 첫 60초 듣기 (몇 초에서 입을 열었는지만 기억)", "[조각] 한 줄 + [한 문장] 한 줄로 오늘을 남기기 — 더 쓰고 싶어도 거기서 멈추기"]}, {"id": "build", "kicker": "비즈니스 빌드업", "title": "지금 통과할 게이트는 하나: 1R 50명과 Insight 20%", "evidence": "모두의창업 v2: '일정표를 통과 기준이 있는 게이트로 바꿨습니다' · 멘토링 요청 ①: '공개·실증이 신규성에 영향을 줄 수 있으므로'", "body_md": "모두의창업 v2에서 가장 잘 하신 일은 일정표를 **통과 기준이 있는 게이트**로 바꾼 것입니다. 게이트 방식의 장점은 오늘 해야 할 일이 저절로 좁혀진다는 데 있습니다. 지금 게이트는 하나, 1R 50명 코호트에서 자기 언어 Insight 20%를 검증하는 것입니다. 기관 파일럿, 선물 경제, 소셜벤처 판별은 모두 이 게이트 뒤에 있습니다.\n\n### 1. 'Insight'를 먼저 셀 수 있게 만드세요\n20%라는 목표보다 앞서야 할 것은 무엇을 1로 셀지입니다. 베타의 7%가 어떤 정의로 나온 숫자인지, 1R에서도 같은 정의를 쓸지부터 적어 두시길 권합니다. 예를 들면 이렇습니다.\n- **포함:** 유저가 AI 비춤을 받은 뒤, AI 문장을 복사하지 않고 자기 단어로 쓴 '한 문장'이 있고, 그것이 이전 기록과 다른 관점을 담고 있다.\n- **제외:** AI 문장을 그대로 수락한 경우, 감정 표현만 있고 관점 변화가 없는 경우.\n- **애매:** 따로 표시하고 숫자로 셉니다. 애매한 비율이 높다면 정의보다 UX가 문제일 수 있습니다.\n\n베타 카드 20장을 이 기준으로 직접 분류해 보세요. 한 시간이면 됩니다. 분류가 흔들리는 지점이 곧 1R 넛지를 고칠 지점입니다. 이미 40개 테이블과 7,194건이 있으니 **새 테이블을 만들지 말고**, 원문과 AI 초안과 최종 문장의 차이를 기존 데이터에서 계산할 수 있는지부터 확인하시면 됩니다.\n\n### 2. 공개하기 전에 변리사를 먼저 만나세요\n오늘 가장 놓치기 쉬운 연결고리가 여기 있습니다. v2의 멘토링 요청 1번에 이미 적어 두셨습니다. **공개와 실증이 신규성에 영향을 줄 수 있다.** 그런데 Creator OS Phase 2는 공개 Pilot이고, 3줄 카드는 콘텐츠로도 그대로 읽힙니다. 유튜브에 A-B-Bridge 구조, Lived Evidence 기반 넛지, Storydoing→Return→Gift 흐름이 화면으로 나가는 순간이 곧 공개 시점일 수 있습니다. 그래서 순서는 이렇게 권합니다. **Phase 1 비공개 4편 → 변리사 상담과 IP Map → Phase 2 공개.** 비공개 4편을 먼저 만들자는 브리프의 설계가 IP 관점에서도 정확히 맞는 셈입니다.\n\n### 3. 기관 3곳에는 '담당자의 다음 행동' 하나씩\n후보 기관마다 한 줄씩만 적어 보세요. 그 기관 담당자가 다음 달에 해야 하는 보고는 무엇인가. 온순간의 기관 리포트가 그 보고의 한 페이지를 대신할 수 있다면, 그게 제안서의 첫 장입니다. 23년간 전략 파트너사를 설계해 오신 범님에게는 익숙한 일입니다. 매장 대신 기관, POS 대신 동의 범위의 집계 리포트로 바뀌었을 뿐입니다.\n\n### 4. 멘토 시간은 결정 직전에만\nv2에 쓰신 대로 멘토님의 시간은 결정 직전에만 요청하시면 됩니다. 그러려면 결정 메모 양식 하나가 필요합니다. **결정할 것 / 선택지 2~3개 / 근거 / 되돌리기 어려운 정도 / 마감일.** 첫 메모의 주제는 '공개 전 출원 범위'가 좋겠습니다.", "actions": ["Insight 정의 1페이지 작성 후 베타 카드 20장 직접 분류", "변리사에게 물을 '공개 전 출원 범위' 질문 5개 정리", "후보 기관 3곳의 '담당자 다음 행동' 한 줄씩, 1곳에 연락"]}, {"id": "content", "kicker": "콘텐츠 실행", "title": "매일 찍지 않는다, 오늘 한 장면만 목격한다", "evidence": "Creator OS 브리프: 'Phase 0 — 1주 정본 세팅', '매일 콘텐츠를 만들지 않는다. 매일 온순간을 살고 증거만 남긴다.'", "body_md": "Creator OS 브리프의 첫 문장으로 돌아가 봅니다. **나는 유튜브를 하기 위해 온순간을 사는 것이 아니다.** 이번 주에 할 일은 촬영이 아니라 Phase 0, 정본을 세팅하는 1주입니다. 영상을 한 편도 만들지 않아도 되는 주간이라는 뜻이기도 합니다.\n\n### Phase 0에 필요한 최소한\n- **촬영 헌법 한 장:** Experience First · No Re-enactment · No Manufactured Wisdom · No Forced Choice · Return Honestly. 거기에 '보여주지 않은 것은 해석하지 않는다'를 더하면 됩니다.\n- **5-shot 카드:** WHERE · MOVE · DETAIL · HUMAN · EVIDENCE. Pocket 4P 케이스에 붙여 둘 크기면 충분합니다.\n- **파일 규칙:** `20260923_장소_사람또는질문_shot번호`. 폴더는 `raw / voice / selects / episodes` 네 개로 시작합니다. 메타데이터는 나중에 AI가 채웁니다.\n- **동의 기준:** 가족도 동의 대상입니다. 아내와 아들에게 \"당신 얼굴은 찍지 않는다, 목소리는 물어보고 쓴다\"를 먼저 말해 두세요.\n\nAgent 10개는 지금 만들지 않습니다. 브리프에 쓰신 대로 **커스텀 개발은 반복 검증된 병목에만** 합니다. Phase 1에서 실제로 막히는 곳은 아마 둘일 겁니다. 음성을 텍스트로 옮기는 일, 그리고 몇 시간짜리 footage에서 장면을 찾는 일. 둘 다 기존 도구와 Claude Code 헤드리스 호출로 충분히 시작할 수 있습니다.\n\n### 오늘의 선택이 곧 첫 편이 될 수 있습니다\n오늘의 선택인 '첫 60초는 답하지 않고 듣기'는 그대로 **[오늘 한번 살아봤습니다]** 시리즈의 첫 편 씨앗입니다. 콘텐츠를 기획하지 않았는데 삶에서 콘텐츠가 생기는 구조, 브리프가 말한 Life → Story → Storydoing → Life가 바로 이것입니다. 오늘 해야 할 촬영은 딱 하나입니다. 듣기를 해 본 뒤, 또는 못 했던 순간 뒤에 10~30분을 기다렸다가 60초짜리 Voice Memo를 남기는 것.\n\n> 방금 무슨 일이 있었나? 예상과 무엇이 달랐나? 내게 뭐가 걸렸나?\n\n그 음성이 편집 때 가장 좋은 내레이션 원재료가 됩니다. 그리고 D+7에 다시 묻습니다. 정말 했는가? 7일 중 2일이었다면 제목은 이미 나와 있습니다. '7일 중 2일밖에 못 했습니다.' 시청자가 돌아오는 이유는 성공이 아니라 정직한 Return입니다.\n\n### 콘텐츠와 비즈니스가 만나는 곳\n3줄 카드는 유저에게는 자기코칭의 근거이고, 밖에서는 콘텐츠이고, 기관에는 변화의 근거입니다. 범님이 직접 만든 3줄 카드와 그 뒤의 Return이 쌓이면, 그 자체로 기관 제안서에 넣을 수 있는 1인칭 사례가 됩니다. 단, 공개는 IP 확인 뒤에 합니다.", "actions": ["촬영 헌법 + 5-shot + 파일 규칙을 A4 한 장으로", "아내·아들에게 촬영 원칙(얼굴 X, 목소리는 동의 후) 먼저 말하기", "60초 듣기 뒤 10~30분 기다렸다가 Voice Memo 1개"]}, {"id": "claude", "kicker": "Claude Code 마스터리", "title": "Claude Code를 '깊은 대화 상대'에서 '운영체제'로", "evidence": "9/18 정리: '대화를 통째로 넣고 구현해라고 하지 않는다 … 7번의 전달' · A0 점검: repo migration 파일 수와 live schema_migrations 기록 불일치", "body_md": "범님은 Claude Code를 대화 상대로 아주 깊이 쓰고 계십니다. 18일 하루의 정리만 해도 20만 자가 넘는 문서가 되었으니까요. 이제 필요한 전환은 Claude Code를 **깊은 대화 상대에서 반복 가능한 운영체제로** 바꾸는 일입니다. 범님이 이미 적어 두신 원칙, 즉 작게 나누기, 실제 데이터 먼저 검수하기, 기존 MVP 깨지 않기, 하나의 source of truth를 도구 쪽에서 강제하는 방법이 있습니다.\n\n### 1. CLAUDE.md는 짧게, 정본은 링크로\nCLAUDE.md에 철학을 다 넣으면 매 세션이 무거워지고, 오래된 문장이 새 결정과 섞입니다. CLAUDE.md에는 규칙 열 줄 안팎만 두고 `@docs/CORE.md`, `@docs/PRODUCT_INVARIANTS.md`처럼 정본 파일을 불러오게 하세요. 규칙 첫 줄은 이미 쓰신 문장이면 충분합니다. **새 기능·새 table·새 ontology·새 ADR을 먼저 만들지 않는다. 먼저 대조한다.**\n\n### 2. 한 세션에는 한 가지 일만\n긴 세션일수록 Claude가 앞선 맥락과 지금의 우선순위를 섞습니다. 18일에 이 위험을 직접 짚으셨죠. 일 하나가 끝나면 `/clear`로 비우고, 다음 일은 새로 시작합니다. 이어서 해야 한다면 `/compact`에 무엇을 남길지 적어서 넘기면 됩니다. 예: `/compact 결정된 것과 남은 TODO만`.\n\n### 3. 구현 전에는 plan mode\nShift+Tab을 두 번 누르면 plan mode로 들어갑니다. Claude가 파일을 고치기 전에 무엇을 어디서 바꿀지 먼저 보여줍니다. Founder Direction을 전달하는 7번의 과정과 궁합이 좋습니다. 계획을 읽고 '이건 새 table이네, 기존 테이블로 가능한지 다시'라고 한 번 되돌리는 것만으로 과잉 생성의 대부분이 막힙니다.\n\n### 4. 감사(audit)는 서브에이전트에게\nrepo의 migration 파일 수와 live DB의 `schema_migrations` 기록 수가 맞지 않는다는 점을 A0 점검에서 확인하셨습니다. 이런 전수 대조는 메인 대화에서 하지 말고 서브에이전트에게 맡기세요. 메인 컨텍스트는 깨끗하게 남고, 결과는 표 한 장으로 돌아옵니다. **수정하지 말고 보고만 하라**고 못 박는 것이 핵심입니다.\n\n### 5. 반복되는 전달은 skill로\nFounder Direction을 받아 대조하고 보고하는 절차는 앞으로도 계속 반복됩니다. `.claude/skills/founder-direction/SKILL.md`로 만들어 두면 `/founder-direction` 한 번으로 같은 절차가 매번 같은 품질로 돕니다. Integrity Check(실제 있었나, 내 말인가, 억지 의미는 없나)도 같은 방식으로 skill이 될 수 있습니다.\n\n### 6. 사람 없이 돌아가는 일은 `claude -p`로\n지금 이 아침 창이 바로 그 예입니다. 헤드리스 모드인 `claude -p`는 스크립트 안에서 Claude를 한 번 호출하고 결과만 받아옵니다. Creator OS의 TRANSCRIBE 다음 단계인 Moment 태깅이나 주간 Insight 지표 요약을 이 방식으로 시작하면, 앱을 새로 만들지 않고도 Agent를 가질 수 있습니다.", "actions": ["CLAUDE.md를 규칙 10줄 안팎 + @정본 파일 링크로 정리", "migration 대조를 서브에이전트에게 '보고만' 시키기", "/founder-direction skill 초안 만들기"]}, {"id": "rhythm", "kicker": "오늘의 리듬", "title": "범님이 설계한 리듬 위에 하루를 얹는다", "evidence": "2nd Life 엑셀 · Bucket lists 시트의 요일별 일과 · 90일 미션 0번 '건강 완전 회복' · '설렘의 여정' 제작 원칙", "body_md": "범님은 이미 스스로 이상적인 한 주를 설계해 두셨습니다. 2nd Life 엑셀의 Bucket lists 시트에 있는 그 표입니다. **06시 기도와 스트레칭, 07시 자전거와 러닝 그리고 말씀, 19시 글쓰기, 20시 운동, 21시 온순간 블로그, 22시 Dream.** 요일마다 색도 다릅니다. 월·화       <div><div class="ttl"><span>${esc(b.title)}</span><span class="chip tag-${tagOf(b.tag)}">${TAGS[tagOf(b.tag)]}</span></div>${b.detail ? `<div class="det">${esc(b.detail)}</div>` : ""}</div></li>`;
  }).join("");
  $("plan").addEventListener("change", (ev) => { const li = ev.target.closest("li"); const i = +li.dataset.i; planDone[i] = ev.target.checked; li.classList.toggle("checked", ev.target.checked); store.set("plan", planDone); renderPlanCount(); });
  renderPlanCount();
  $("gates").innerHTML = (D.milestones || []).map((m) => {
    let dd = ""; if (typeof m.dday === "number") dd = m.dday === 0 ? "D-DAY" : m.dday > 0 ? `D-${m.dday}` : `D+${-m.dday}`; else if (m.status !== "done") dd = "날짜 미정";
    const soon = typeof m.dday === "number" && m.dday >= 0 && m.dday <= 14;
    return `<li data-s="${esc(m.status)}"><span class="dot" aria-hidden="true"></span><span class="g-title">${esc(m.title)}</span><span class="dday${soon ? " soon" : ""}">${dd}</span></li>`;
  }).join("") || `<li><span></span><span class="g-title">config.json 의 milestones에 날짜를 적어 주세요.</span></li>`;

  // ---------- 4. radar
  const R = D.radar || {};
  const rm = R.meta || {};
  $("radarMeta").textContent = rm.source === "web" ? `웹 검색 · ${String(rm.searched_at || "").replace("T", " ")}` : "검색 전 · 기본 목록";
  const whenChip = (dateStr, fallback) => {
    const n = daysTo(dateStr);
    if (n === null) return `<span class="when">${esc(fallback || "확인 필요")}</span>`;
    if (n < 0) return `<span class="when">진행 중</span>`;
    return `<span class="when${n <= 7 ? " hot" : ""}">${n === 0 ? "오늘" : "D-" + n}</span>`;
  };
  const link = (u, label) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${label} ↗</a>` : "";
  const cols = [
    { title: "정부지원사업", tag: "build", items: R.grants || [], card: (g) => `<div class="top"><b>${esc(g.title)}</b>${whenChip(g.deadline, g.status)}</div>
        <span class="org">${esc(g.org || "")}${g.deadline ? " · 마감 " + md(0, g.deadline) : ""}</span>${g.fit ? `<p>${esc(g.fit)}</p>` : ""}${g.action ? `<span class="act">${esc(g.action)}</span>` : ""}${link(g.url, "공고 보기")}` },
    { title: "AI 교육", tag: "claude", items: R.ai_edu || [], card: (e) => `<div class="top"><b>${esc(e.title)}</b>${whenChip(e.date, e.date || "상시")}</div>
        <span class="org">${esc([e.org, e.format, e.cost].filter(Boolean).join(" · "))}</span>${e.fit ? `<p>${esc(e.fit)}</p>` : ""}${link(e.url, "신청 보기")}` },
    { title: "국내 일정 · 콘텐츠", tag: "content", items: R.events || [], card: (e) => `<div class="top"><b>${esc(e.title)}</b>${whenChip(e.date_start, "이달 시즌")}</div>
        <span class="org">${esc([e.place, e.date_start ? md(0, e.date_start) + (e.date_end ? "–" + md(0, e.date_end) : "") : ""].filter(Boolean).join(" · "))}</span>${e.fit ? `<p>${esc(e.fit)}</p>` : ""}${e.shot ? `<span class="act">${esc(e.shot)}</span>` : ""}${link(e.url, "일정 보기")}` },
  ];
  $("radar").innerHTML = cols.map((c) => `<div class="col"><h3><span class="chip tag-${c.tag}">${TAGS[c.tag]}</span>${c.title}<span class="n">${c.items.length}</span></h3>
      ${c.items.length ? c.items.map((it) => `<div class="item">${c.card(it)}</div>`).join("") : `<div class="radar-empty">오늘은 새로 찾은 항목이 없습니다.</div>`}</div>`).join("")
    + (rm.note ? `<div class="radar-empty" style="grid-column:1/-1">${esc(rm.note)}</div>` : "");

  // ---------- 5. advice tabs
  function mdToHtml(src) {
    const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
    let html = "", list = null, para = [];
    const endPara = () => { if (para.length) { html += `<p>${inline(para.join(" "))}</p>`; para = []; } };
    const endList = () => { if (list) { html += `</${list}>`; list = null; } };
    for (const raw of String(src || "").split(/\r?\n/)) {
      const l = raw.trim(); let m;
      if (!l) { endPara(); endList(); }
      else if ((m = /^#{2,4}\s+(.*)/.exec(l))) { endPara(); endList(); html += `<h3>${inline(m[1])}</h3>`; }
      else if ((m = /^>\s?(.*)/.exec(l))) { endPara(); endList(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
      else if ((m = /^[-*]\s+(.*)/.exec(l))) { endPara(); if (list !== "ul") { endList(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = /^\d+[.)]\s+(.*)/.exec(l))) { endPara(); if (list !== "ol") { endList(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else { endList(); para.push(l); }
    }
    endPara(); endList(); return html;
  }
  const chapters = D.chapters || [];
  const actDone = store.get("actions", {});
  const cm = D.content_mission || {};
  const shotsDone = store.get("shots", {});
  function extras(id) {
    if (id === "content") {
      return `<div class="extra">${cm.question ? `<h4>오늘 품고 다닐 질문</h4><p class="q">${esc(cm.question)}</p>` : ""}
        ${(cm.shots || []).length ? `<h4>5-shot · Moment가 걸릴 때만</h4><ul class="shots">${cm.shots.map((s, i) => `<li><label class="shot${shotsDone[i] ? " on" : ""}" for="shot-${i}"><input type="checkbox" id="shot-${i}" data-shot="${i}" ${shotsDone[i] ? "checked" : ""}><b>${esc(s.key)}</b><span>${esc(s.hint)}</span></label></li>`).join("")}</ul>` : ""}
        ${(cm.voice_memo || []).length ? `<h4>경험 10~30분 뒤 · 60초 Voice Memo</h4><ol class="plain">${cm.voice_memo.map((q) => `<li>${esc(q)}</li>`).join("")}</ol>` : ""}
        ${cm.episode_seed ? `<h4>이번 주 에피소드 씨앗</h4><p class="plain" style="padding:0">${esc(cm.episode_seed)}</p>` : ""}</div>`;
    }
    if (id === "claude" && (D.claude_code || []).length) {
      return `<div class="extra"><h4>복사해서 바로 쓰는 프롬프트</h4><div class="tips">${D.claude_code.map((t, i) => `<div class="tip"><b>${esc(t.title)}</b><p>${esc(t.why)}</p><p>${esc(t.how)}</p>
        ${t.prompt ? `<pre class="prompt-box" id="pr-${i}">${esc(t.prompt)}</pre><button class="copy" type="button" data-copy="${i}">프롬프트 복사</button>` : ""}</div>`).join("")}</div></div>`;
    }
    if (id === "rhythm" && (D.watchouts || []).length) {
      return `<div class="extra"><h4>오늘 조심할 패턴</h4><ul class="plain">${D.watchouts.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div>`;
    }
    return "";
  }
  let active = 0; try { active = Math.min(chapters.length - 1, Math.max(0, +(sessionStorage.getItem("onmoment:tab") || 0))); } catch (e) {}
  function showTab(i) {
    active = i; try { sessionStorage.setItem("onmoment:tab", i); } catch (e) {}
    [...$("tabs").children].forEach((b, j) => b.setAttribute("aria-selected", String(j === i)));
    const c = chapters[i]; if (!c) return;
    $("chapter").innerHTML = `<article class="chapter" role="tabpanel"><span class="label tag-${tagOf(c.id)}">${esc(c.kicker || "")}</span>
      <h3 class="ch-title">${esc(c.title)}</h3>
      ${c.evidence ? `<div class="evidence">${esc(c.evidence)}</div>` : ""}
      <div class="prose">${mdToHtml(c.body_md)}</div>
      ${(c.actions || []).length ? `<ul class="actions">${c.actions.map((a, ai) => { const k = i + "-" + ai; return `<li class="${actDone[k] ? "checked" : ""}"><label><input type="checkbox" id="act-${k}" data-act="${k}" ${actDone[k] ? "checked" : ""}><span>${esc(a)}</span></label></li>`; }).join("")}</ul>` : ""}
      ${extras(c.id)}</article>`;
  }
  const TAB_NAMES = { life: "온순간을 산다", build: "비즈니스", content: "콘텐츠", claude: "Claude Code", rhythm: "리듬" };
  $("tabs").innerHTML = chapters.map((c, i) => `<button class="tab" role="tab" type="button" data-tab="${i}">${esc(TAB_NAMES[c.id] || c.kicker || c.title)}</button>`).join("");
  $("tabs").addEventListener("click", (ev) => { const b = ev.target.closest("[data-tab]"); if (b) showTab(+b.dataset.tab); });
  $("chapter").addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset.act) { actDone[t.dataset.act] = t.checked; t.closest("li").classList.toggle("checked", t.checked); store.set("actions", actDone); }
    if (t.dataset.shot) { shotsDone[t.dataset.shot] = t.checked; t.closest(".shot").classList.toggle("on", t.checked); store.set("shots", shotsDone); }
  });
  $("chapter").addEventListener("click", async (ev) => {
    const b = ev.target.closest("[data-copy]"); if (!b) return;
    const box = $("pr-" + b.dataset.copy);
    try { await navigator.clipboard.writeText(box.textContent); b.textContent = "복사됨"; }
    catch (e) { const r = document.createRange(); r.selectNodeContents(box); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "선택됨 · Ctrl+C"; }
    setTimeout(() => (b.textContent = "프롬프트 복사"), 1800);
  });
  if (chapters.length) showTab(active);

  // ---------- 6. evening
  const evq = D.evening || [];
  const answers = store.get("evening", {});
  $("evening").innerHTML = evq.map((q, i) => `<label for="ev-${i}">${esc(q)}<textarea id="ev-${i}" data-i="${i}" placeholder="짧게, 있는 그대로.">${esc(answers[i] || "")}</textarea></label>`).join("") +
    `<div class="row-btns"><button class="btn" type="submit">Return 파일로 저장</button><button class="btn ghost" type="button" id="copyReturn">텍스트 복사</button><span class="status" id="evStatus">입력은 이 컴퓨터에 자동 저장됩니다.</span></div>`;
  $("evening").addEventListener("input", (e) => { const i = e.target.dataset.i; if (i == null) return; answers[i] = e.target.value; store.set("evening", answers); });
  const returnText = () => {
    const three = ["reality", "wish", "choice"].map((k) => $("l-" + k).textContent.trim());
    return `# 온순간 Return · ${D.date}\n\n## 오늘의 3줄\n- 현재: ${three[0]}\n- 바람: ${three[1]}\n- 선택: ${three[2]}\n\n## 오늘 꼭 할 3가지\n` +
      top3.map((t, i) => `- [${todoDone[i] ? "x" : " "}] ${t.text}`).join("\n") +
      `\n\n## 흐름 (${plan.filter((_, i) => planDone[i]).length} / ${plan.length})\n` + plan.map((b, i) => `- [${planDone[i] ? "x" : " "}] ${b.time} ${b.title}`).join("\n") +
      `\n\n## 밤 3분\n` + evq.map((q, i) => `### ${q}\n${(answers[i] || "").trim() || "(비움)"}\n`).join("\n");
  };
  $("evening").addEventListener("submit", (e) => {
    e.preventDefault();
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([returnText()], { type: "text/markdown;charset=utf-8" }));
    a.download = `onmoment-return-${D.date}.md`; document.body.appendChild(a); a.click(); a.remove();
    $("evStatus").textContent = "다운로드 폴더에 저장했습니다. 내일 아침 조언이 이 기록을 읽습니다.";
  });
  $("copyReturn").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(returnText()); $("evStatus").textContent = "복사했습니다."; }
    catch (e) { $("evStatus").textContent = "복사가 막혀 있습니다. 파일 저장을 이용해 주세요."; }
  });

  $("foot").innerHTML = `<span>Live fully. Capture lightly. Reflect honestly.</span><span>${esc(D.meta?.generated_at ? "생성 " + D.meta.generated_at.replace("T", " ") : "")}</span>`;
})();
</script>
</body>
</html>
